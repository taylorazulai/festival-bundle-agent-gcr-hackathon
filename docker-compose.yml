services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongo:27017/festival_bundle_agent
      - USE_LOCAL_DATA=false
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AGENT_MODEL=${AGENT_MODEL:-gemini-2.0-flash}
      - LOG_LEVEL=INFO
      - PORT=8080
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro

volumes:
  mongo_data:
