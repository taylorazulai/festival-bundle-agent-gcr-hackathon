<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Festival Bundle Agent</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <h1>🎪 Festival Bundle Agent</h1>
    <p class="subtitle">Your AI inventory bundling assistant</p>
  </header>

  <main class="chat-container">
    <div id="chat-messages" class="chat-messages" aria-live="polite"></div>

    <div id="error-banner" class="error-banner hidden">
      <span id="error-text">Something went wrong.</span>
      <button type="button" id="retry-btn" class="retry-btn">Retry</button>
    </div>

    <div class="input-area">
      <div class="prompt-chips">
        <button type="button" class="chip" data-prompt="What bundles can I create?">What bundles can I create?</button>
        <button type="button" class="chip" data-prompt="Show overstocked items">Show overstocked items</button>
        <button type="button" class="chip" data-prompt="Best margin deals">Best margin deals</button>
      </div>
      <div class="input-row">
        <input
          type="text"
          id="message-input"
          placeholder="Ask about inventory, bundles, pricing..."
          autocomplete="off"
          aria-label="Chat message"
        />
        <button type="button" id="send-btn" class="send-btn">Send</button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
