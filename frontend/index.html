<!DOCTYPE html>
<html lang="en" data-theme="festival">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ea580c" />
  <meta name="description" content="AI-powered festival inventory bundling assistant" />
  <title>Festival Bundle Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-left">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="Open navigation" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div class="logo">
          <span class="logo-emoji" aria-hidden="true">🎪</span>
          <span class="logo-text">Festival Bundle Agent</span>
        </div>
      </div>
      <div class="header-pills" aria-label="Service status">
        <span class="pill pill-live"><span class="pill-dot"></span>Live</span>
        <span class="pill" id="pill-mongo"><span class="pill-dot"></span>MongoDB</span>
        <span class="pill" id="pill-gemini"><span class="pill-dot"></span>Gemini</span>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <nav class="sidebar-nav">
          <button type="button" class="nav-item active" data-view="chat">
            <span class="nav-icon" aria-hidden="true">💬</span>
            <span>Chat</span>
          </button>
          <button type="button" class="nav-item" data-view="dashboard">
            <span class="nav-icon" aria-hidden="true">📊</span>
            <span>Dashboard</span>
          </button>
          <button type="button" class="nav-item" data-view="inventory">
            <span class="nav-icon" aria-hidden="true">📦</span>
            <span>Inventory</span>
          </button>
          <button type="button" class="nav-item" data-view="bundles">
            <span class="nav-icon" aria-hidden="true">🎯</span>
            <span>Bundles</span>
          </button>
        </nav>
        <div class="sidebar-section">
          <h2 class="sidebar-heading">Recent Items</h2>
          <ul class="recent-list" id="recent-list">
            <li class="recent-empty">Ask about inventory to populate</li>
          </ul>
        </div>
      </aside>
      <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

      <main class="chat-main">
        <div class="chat-scroll" id="chat-messages" aria-live="polite"></div>

        <button type="button" class="scroll-bottom-btn hidden" id="scroll-bottom-btn" aria-label="Scroll to latest messages">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 5v14M5 12l7 7 7-7" />
          </svg>
        </button>

        <div id="error-banner" class="error-card hidden" role="alert">
          <div class="error-card-body">
            <span class="error-icon" aria-hidden="true">⚠️</span>
            <div>
              <p class="error-title">Something went wrong</p>
              <p id="error-text" class="error-message">Unable to reach the agent.</p>
            </div>
          </div>
          <button type="button" id="retry-btn" class="btn btn-outline">Try again</button>
        </div>

        <div class="input-area">
          <div class="prompt-chips" role="group" aria-label="Quick prompts">
            <button type="button" class="chip" data-prompt="Show overstocked items">Show overstocked items</button>
            <button type="button" class="chip" data-prompt="Create bundles">Create bundles</button>
            <button type="button" class="chip" data-prompt="Best margin deals">Best margin deals</button>
          </div>
          <div class="input-row">
            <input
              type="text"
              id="message-input"
              placeholder="Ask about inventory, bundles, pricing..."
              autocomplete="off"
              aria-label="Chat message"
            />
            <button type="button" id="send-btn" class="send-btn" aria-label="Send message">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </button>
          </div>
        </div>
      </main>
    </div>

    <footer class="app-footer" id="status-footer">
      <span class="footer-dot" id="footer-dot"></span>
      <span id="footer-status-text">Connecting to services…</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
